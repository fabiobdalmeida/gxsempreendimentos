<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GXS Empreendimentos & Estruturas</title>
    <style>
        /* Estilos Base e Identidade Visual */
        :root {
            --azul-escuro: #002244;
            --azul-destaque: #0055A4;
            --branco: #FFFFFF;
            --preto: #111111;
            --cinza-claro: #F4F4F4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--cinza-claro);
            color: var(--preto);
            line-height: 1.6;
        }

        /* Navegação */
        header {
            background-color: var(--azul-escuro);
            color: var(--branco);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .logo span {
            font-size: 0.9rem;
            font-weight: normal;
            display: block;
            color: #CCCCCC;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav ul li a {
            color: var(--branco);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: var(--azul-destaque);
        }

        /* Seção Hero (Banner Principal) */
        .hero {
            background-color: var(--azul-escuro);
            color: var(--branco);
            text-align: center;
            padding: 100px 20px;
            /* Se for adicionar uma imagem de fundo depois, use:
            background-image: url('sua-imagem-de-obra.jpg');
            background-size: cover;
            background-blend-mode: multiply; */
        }

        .hero h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .cta-btn {
            background-color: var(--azul-destaque);
            color: var(--branco);
            padding: 15px 30px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .cta-btn:hover {
            background-color: #004080;
        }

        /* Seção de Serviços */
        .servicos {
            padding: 60px 5%;
            text-align: center;
            background-color: var(--branco);
        }

        .servicos h3 {
            font-size: 2rem;
            color: var(--azul-escuro);
            margin-bottom: 40px;
        }

        .grid-servicos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }

        .card-servico {
            background-color: var(--cinza-claro);
            padding: 30px;
            border-radius: 8px;
            border-bottom: 4px solid var(--azul-destaque);
        }

        .card-servico h4 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: var(--azul-escuro);
        }

        /* Rodapé */
        footer {
            background-color: var(--preto);
            color: var(--branco);
            text-align: center;
            padding: 30px 20px;
            font-size: 0.9rem;
        }

        footer p {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <h1>GXS</h1>
            <span>Empreendimentos & Estruturas</span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="sobre.html">Sobre a GXS</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
